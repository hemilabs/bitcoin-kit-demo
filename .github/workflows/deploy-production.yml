# GitHub Actions workflow to deploy the Bitcoin Kit Demo to the production environment.
name: "Production Deployment"
on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: "production-deploy-${{ github.event.number || github.ref }}"
  cancel-in-progress: false

jobs:
  # Build and push Docker image
  docker:
    name: Docker
    uses: hemilabs/.github/.github/workflows/docker.yml@c0d930f1959633dd7dc1203d95ec6634dbaf9a34 # v1.2.0
    permissions:
      contents: read
      packages: write # Needed to push to the GitHub Container Registry
    with:
      version: "${{ github.sha }}"
      context: "."
      file: "./Dockerfile"
      dockerhub: true
      tags: |
        hemilabs/bitcoin-kit:${{ github.sha }}
        ghcr.io/hemilabs/bitcoin-kit:${{ github.sha }}
      build-args: |
        BUILD_MODE=mainnet
        VITE_HEMI_BITCOIN_KIT_ANALYTICS_WEBSITE_ID=${{ vars.VITE_HEMI_BITCOIN_KIT_ANALYTICS_WEBSITE_ID }}
    secrets:
      DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
      DOCKERHUB_PASSWORD: "${{ secrets.DOCKERHUB_TOKEN }}"
